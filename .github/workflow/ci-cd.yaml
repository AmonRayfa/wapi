name: CI/CD

on:
  push:
    branches: [dev, v1]
    tags: [v*-*.*]
  pull_request:
    branches: [dev, v1]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Build for debugging
        run: cargo build --all-features --verbose

      - name: Build for release
        run: cargo build --release --all-features --verbose

  cd:
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicit write permission for releases.

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          if [ -f "CHANGELOG.md" ]; then
             RELEASE_NOTES=$(awk '/^## /{i++}i==1{print; while(getline && !/^## /) print; exit}' CHANGELOG.md | tail -n +2)
          else
             RELEASE_NOTES="No changelog found."
          fi
          gh release create "$RELEASE_VERSION" --title "$RELEASE_VERSION" --notes "$RELEASE_NOTES"
