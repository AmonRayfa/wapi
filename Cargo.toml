[package]
name = "wapi"
edition = "2024"
authors = ["Amon Rayfa <amon@koseka.net>"]
description = "A cross-platform DDNS client that automatically updates your DNS records when your IP address changes."
repository = "https://github.com/AmonRayfa/wapi"
documentation = "https://wapi.readthedocs.io"
license = "Apache-2.0"
readme = "README.md"
exclude = [
  ".cargo",
  ".env",
  ".github",
  ".gitignore",
  ".trunk",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "dist",
  "docs",
  "img",
  "node_modules",
  "package.json",
  "package-lock.json",
  "SECURITY.md",
]
publish = false

[dependencies]
addr = "0.15"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
directories = "6.0"
mabe = { git = "https://github.com/AmonRayfa/mabe", branch = "v1" }
reqwest = { version = "0.13", features = ["blocking", "json"] }
rkyv = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
